services:
  postgres:
    image: postgres:18-bookworm
    container_name: postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql/
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - up

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka_broker
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: cmd/app/Dockerfile
    container_name: avito_kitchen_app
    env_file:
      - .env
    environment:
      SERVER_ADDR: ":8080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      KAFKA_BROKERS: kafka:19092
      LOGGER_LEVEL: ${LOGGER_LEVEL:-DEBUG}
      LOGGER_FOLDER: /var/log/avito-kitchen
    ports:
      - "8080:8080"
    volumes:
      - app_logs:/var/log/avito-kitchen
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/companies"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  mock-service:
    build:
      context: .
      dockerfile: cmd/mock-service/Dockerfile
    container_name: avito_kitchen_mock
    environment:
      MOCK_REQUEST_TIMEOUT: ${MOCK_REQUEST_TIMEOUT:-5s}
      MOCK_FAILURE_PERCENT: ${MOCK_FAILURE_PERCENT:-80}
    ports:
      - "8081:8081"
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  app_logs:
