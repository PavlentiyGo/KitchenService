version: "2"

run:
  go: "1.26.2"
  timeout: 3m
  tests: true

linters:
  default: standard

  enable:
    - bodyclose
    - errorlint
    - gosec
    - nilerr
    - noctx
    - sqlclosecheck
    - noinlineerr
    - wastedassign

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0